<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meth.rip</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    overflow: hidden;
}

/* VIDEO */
video {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: -1;
}

/* 📱 MOBILE TWEAK */
@media (max-width: 768px) {
    video {
        width: auto;
        height: 100vh;

        /* 🔥 minder crop horizontaal */
        object-fit: cover;
        object-position: center center;

        /* kleine zoom-out maar NIET extreem */
        transform: translate(-50%, -50%) scale(0.85);
    }
}

/* CONTENT */
.content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 3rem;
    font-weight: bold;
    text-shadow: 0 0 20px black;
}
</style>
</head>

<body>

<video id="bg-video" autoplay muted loop playsinline>
    <source src="meth.mp4" type="video/mp4">
</video>

<div class="content">meth.rip</div>

<script>
const video = document.getElementById("bg-video");

/* 🔊 audio unlock */
document.addEventListener("click", () => {
    video.muted = false;
    video.play();
});
</script>

</body>
</html>
