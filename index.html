<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>meth.rip</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* 🎥 VIDEO BACKGROUND */
video {
  position: fixed;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  transform: translate(-50%, -50%);
  object-fit: cover;
  z-index: -2;
}

/* 🔲 DARK OVERLAY */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: -1;
}

/* 🧊 CENTER BOX */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  
  backdrop-filter: blur(15px);
  background: rgba(0,0,0,0.4);
  
  color: white;
  width: 300px;
}

/* 🔥 TITLE */
.card h1 {
  margin-bottom: 20px;
}

/* 🔗 BUTTONS */
.btn {
  display: block;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  
  text-decoration: none;
  color: white;
  
  background: rgba(255,255,255,0.1);
  transition: 0.3s;
}

/* ✨ HOVER GLOW */
.btn:hover {
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 15px rgba(255,255,255,0.4);
}
</style>
</head>

<body>

<!-- 🎥 VIDEO -->
<video autoplay muted loop playsinline>
  <source src="meth.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- 🧊 CONTENT -->
<div class="card">
  <h1>meth.rip</h1>

  <a href="#" class="btn">Discord</a>
  <a href="#" class="btn">Telegram</a>
  <a href="#" class="btn">Twitter</a>
</div>

</body>
</html>
