<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meth.rip</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    /* VIDEO BASIS */
    video {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        
        min-width: 100%;
        min-height: 100%;

        object-fit: cover;
        z-index: -1;
    }

    /* 📱 MOBILE FIX (zoom out ~150%) */
    @media (max-width: 768px) {
        video {
            width: 100%;
            height: auto;

            min-width: unset;
            min-height: unset;

            transform: translate(-50%, -50%) scale(0.67); /* ≈ 150% uitgezoomd */
            object-fit: contain;
            background: black;
        }
    }

    /* CONTENT */
    .content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 3rem;
        text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
</style>
</head>

<body>

<video id="bg-video" autoplay muted loop playsinline>
    <source src="meth.mp4" type="video/mp4">
</video>

<div class="content">
    <h1>meth.rip</h1>
</div>

<script>
    const video = document.getElementById("bg-video");

    // 🔊 Audio unlock (nodig voor telefoon)
    document.addEventListener("click", () => {
        video.muted = false;
        video.play();
    });
</script>

</body>
</html>
