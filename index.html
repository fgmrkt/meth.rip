<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>meth.rip</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* 🎥 Video background */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* 🌑 Dark overlay */
    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    /* 🧊 Content card */
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(20,20,20,0.6);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      width: 300px;
      margin: auto;
    }

    img {
      width: 100px;
      border-radius: 50%;
    }

    h1 {
      margin: 15px 0 5px;
    }

    p {
      color: #ccc;
    }

    .links a {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .links a:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <!-- 🎥 VIDEO -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="meth.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- 🧊 CONTENT -->
  <div class="card">
    <img src="https://via.placeholder.com/100">
    <h1>@fgmrkt</h1>
    <p>your bio here</p>

    <div class="links">
      <a href="#">Discord</a>
      <a href="#">Telegram</a>
      <a href="#">Twitter</a>
    </div>
  </div>

</body>
</html>
